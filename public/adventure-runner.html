<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070e19;color:#dceaf5;font:14px/1.55 system-ui,-apple-system,sans-serif}
main{padding:13px;min-height:100vh;display:flex;flex-direction:column;gap:9px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:750;color:#8edcf5}
button{background:#173b57;border:1px solid #335d76;color:#e7faff;padding:7px 12px;border-radius:8px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#transcript{margin:0;flex:1;min-height:72px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;color:#d7e8f3}
#prompt-box{display:none;border-top:1px solid #2b4457;padding-top:10px;gap:8px;flex-direction:column}
#prompt{font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;color:#f1da98;white-space:pre-wrap}
form{display:flex;gap:8px}input{flex:1;min-width:0;border-radius:8px;border:1px solid #48627d;background:#0d1a2b;padding:10px;color:white;font:14px ui-monospace,Consolas,monospace}
#status{font-size:12px;color:#a3b5c8}#status.error{color:#ff9b9b}#status.ready{color:#a4edc3}
</style>
<script defer src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script>
<script defer src="/adventure-runner.js"></script></head>
<body><main><header><span>⌨ Consola Python interactiva</span><button type="button" id="stop">■ Atura / reinicia</button></header>
<pre id="transcript" aria-live="polite"></pre><div id="prompt-box"><div id="prompt"></div><form id="answer-form"><input id="answer" autocomplete="off" aria-label="Resposta al programa" placeholder="Escriu la resposta i prem Retorn"><button type="submit">Envia</button></form></div><div id="status">Preparant Python…</div></main></body></html>
